[package]
name = "directline-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Direct Line server for WebChat demo"
publish = false

[[bin]]
name = "directline-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "ws"] }
gsm-core = { workspace = true, features = ["directline_standalone"] }
greentic-types = { workspace = true }
greentic-secrets-spec = { workspace = true }
secrets-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { workspace = true }
http = { workspace = true }
